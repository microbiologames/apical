<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Croissance apicale</title>
<style>
:root{
  --encre:#e8e6ef; --encre-2:#9a97a8; --fond:#0b0b0f; --panneau:#141419;
  --trait:#26262e; --accent:#c9b98a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--fond); color:var(--encre);
  font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#vue{flex:1 1 auto; min-height:0; display:grid; place-items:center; position:relative; overflow:hidden}
canvas{image-rendering:pixelated; image-rendering:crisp-edges; display:block; touch-action:none}
#titre{
  position:absolute; top:10px; left:14px; right:14px; pointer-events:none;
  display:flex; justify-content:space-between; gap:10px; align-items:baseline;
  font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--encre-2);
  text-shadow:0 1px 3px rgba(0,0,0,.65);
}
#mesures{font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
#mesures b{color:var(--accent); font-weight:600}

#panneau{
  flex:0 0 auto; background:var(--panneau); border-top:1px solid var(--trait);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom)); overflow-y:auto; max-height:46vh;
}
#rangee{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center}
.groupe{display:flex; align-items:center; gap:6px}
.groupe>span{color:var(--encre-2); font-size:11px; letter-spacing:.05em}
button{
  font:inherit; font-size:12px; color:var(--encre); background:#1d1d24;
  border:1px solid var(--trait); border-radius:6px; padding:4px 10px; cursor:pointer;
}
button:hover{background:#26262f}
button[aria-pressed="true"]{background:var(--accent); color:#17140c; border-color:var(--accent)}
label.bascule{display:inline-flex; align-items:center; gap:5px; cursor:pointer; font-size:12px; color:var(--encre-2)}
label.bascule input{accent-color:var(--accent); margin:0}
label.bascule:has(input:checked){color:var(--encre)}
.curseur{display:flex; align-items:center; gap:7px; font-size:11px; color:var(--encre-2)}
.curseur input{width:110px; accent-color:var(--accent)}
.curseur output{font-variant-numeric:tabular-nums; color:var(--encre); min-width:2.8em}
#notice{margin:9px 0 0; color:var(--encre-2); font-size:11.5px; line-height:1.5; max-width:none}
#notice b{color:var(--encre); font-weight:600}
details>summary{cursor:pointer; color:var(--encre-2); font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-top:8px}
@media (max-width:620px){ .curseur input{width:84px} #panneau{max-height:52vh} }
</style>
</head>
<body>
<div id="vue">
  <canvas id="toile"></canvas>
  <div id="titre">
    <span>Croissance apicale — <i id="optiqueNom" style="font-style:normal"></i></span>
    <span id="mesures"></span>
  </div>
</div>

<div id="panneau">
  <div id="rangee">
    <div class="groupe">
      <button id="bPause" aria-pressed="false">Pause</button>
      <span>vitesse</span>
      <button data-vit="1" aria-pressed="true">×1</button>
      <button data-vit="2" aria-pressed="false">×2</button>
      <button data-vit="4" aria-pressed="false">×4</button>
    </div>
    <div class="groupe">
      <span>optique</span>
      <button data-pal="phase" aria-pressed="true">Phase</button>
      <button data-pal="noir" aria-pressed="false">Fond noir</button>
      <button data-pal="met" aria-pressed="false">MET</button>
    </div>
    <div class="groupe">
      <span>pilotage</span>
      <button data-pil="auto" aria-pressed="true">Auto</button>
      <button data-pil="souris" aria-pressed="false">Pointeur</button>
    </div>
    <label class="curseur">calotte<input id="cCal" type="range" min="0.55" max="1.40" step="0.01" value="1.00"><output id="oCal"></output></label>
    <label class="curseur">profil<input id="cPro" type="range" min="1.6" max="3.2" step="0.05" value="2"><output id="oPro"></output></label>
    <label class="curseur">zoom<input id="cZoom" type="range" min="0.55" max="1.8" step="0.01" value="1"><output id="oZoom"></output></label>
    <label class="curseur">mise au point<input id="cFoc" type="range" min="-1" max="1" step="0.01" value="0"><output id="oFoc"></output></label>
    <button id="bFocAuto" aria-pressed="true">auto</button>
  </div>
  <div id="rangee" style="margin-top:8px">
    <label class="bascule"><input type="checkbox" data-opt="vesicules" checked>vésicules</label>
    <label class="bascule"><input type="checkbox" data-opt="granulation" checked>granulation</label>
    <label class="bascule"><input type="checkbox" data-opt="organites" checked>organites</label>
    <label class="bascule"><input type="checkbox" data-opt="halo" checked>halo de phase</label>
    <label class="bascule"><input type="checkbox" data-opt="grain" checked>grain de capteur</label>
    <label class="bascule"><input type="checkbox" data-opt="echelle" checked>échelle</label>
    <button id="bReset">Relancer</button>
  </div>
  <p id="notice"></p>
</div>

<script type="module">
import { App } from './src/main.js';
import { PALETTES } from './src/data/palette.js';
import { brancher } from './src/ui.js';
brancher(new App(document.getElementById('toile'), document.getElementById('vue')), PALETTES);
</script>
</body>
</html>
