<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Apical — maquette</title>
<meta name="description" content="Roguelite de croissance apicale : on pilote le Spitzenkorper d'une hyphe fongique.">
<meta name="theme-color" content="#05080b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 15V6' stroke='%239fe8ff' stroke-width='3' fill='none'/><circle cx='8' cy='4' r='3' fill='%239fe8ff'/></svg>">
<style>
  :root {
    --bg: #05080b;
    --ink: #d8e4ef;
    --dim: #5f7383;
    --hot: #ffd479;
    --line: #182a34;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow: hidden; overscroll-behavior: none;
  }
  #wrap { position: relative; height: 100dvh; width: 100vw;
          display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; aspect-ratio: 256 / 352;
           height: min(100dvh, calc(100vw * 352 / 256));
           max-width: 100vw; max-height: 100dvh; }
  canvas { display: block; width: 100%; height: 100%;
           image-rendering: pixelated; image-rendering: crisp-edges;
           touch-action: none; background: var(--bg); }
  .overlay { position: absolute; inset: 0; display: none;
             flex-direction: column; align-items: center; justify-content: center;
             gap: 2.2%; padding: 5% 6%;
             background: rgba(5, 8, 11, 0.9); backdrop-filter: blur(2px); }
  .overlay.on { display: flex; }
  h2 { font-size: clamp(10px, 3.2vmin, 16px); margin: 0 0 1vmin;
       letter-spacing: .12em; color: var(--hot); }
  .carte { width: 100%; border: 1px solid var(--line);
           background: linear-gradient(180deg, rgba(18,34,42,.92), rgba(5,10,13,.94));
           padding: 2.6% 3.2%; cursor: pointer; text-align: left;
           color: inherit; font: inherit; display: block;
           transition: transform .1s, background .1s; }
  .carte:hover, .carte:focus-visible { transform: translateX(2px); outline: none;
           background: linear-gradient(180deg, rgba(26,48,58,.95), rgba(8,15,19,.95)); }
  .carte .top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .carte .nom { font-size: clamp(9px, 2.7vmin, 14px); letter-spacing: .04em; }
  .carte .rar { font-size: clamp(7px, 1.9vmin, 10px); letter-spacing: .1em; white-space: nowrap; }
  .carte .desc { font-size: clamp(8px, 2.2vmin, 11px); color: var(--ink); margin-top: 2%; }
  .carte .note { font-size: clamp(7px, 1.9vmin, 10px); color: var(--dim);
                 margin-top: 1.5%; font-style: italic; line-height: 1.4; }
  .carte .rang { font-size: clamp(7px, 1.8vmin, 10px); color: var(--dim);
                 margin-top: 1.5%; letter-spacing: .08em; }
  #aide { font-size: clamp(7px, 1.9vmin, 10px); color: var(--dim);
          text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="jeu" width="256" height="352"></canvas>

  <div class="overlay" id="offre">
    <h2 id="offre-titre">PALIER DE CROISSANCE</h2>
    <div id="cartes" style="width:100%;display:flex;flex-direction:column;gap:2.2%"></div>
    <div id="aide">1 / 2 / 3 AU CLAVIER</div>
  </div>

  <div class="overlay" id="pause">
    <h2>PAUSE</h2>
    <div id="aide">
      A / D &mdash; BARRER LE SPITZENKORPER<br>
      W &mdash; POUSSEE OSMOTIQUE (brûle du sucre)<br>
      S &mdash; CONSOLIDER (paroi épaisse, absorption)<br>
      ESPACE &mdash; RAMIFIER<br>
      ENTREE &mdash; SPORULER ET ENCAISSER<br>
      ECHAP &mdash; PAUSE
    </div>
  </div>

  <div class="overlay" id="titre"></div>
</div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
